name: Construir APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: DJ SEBAS AI MUSIC STUDIO
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Validar JavaScript de la aplicación
        run: |
          python - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No se encontró el script principal'
          open('/tmp/dj-sebas-app.js', 'w', encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/dj-sebas-app.js
      - name: Preparar archivos de la aplicación
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg sw.js www/
          test -s www/index.html
      - name: Instalar dependencias y crear proyecto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Construir APK de Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: DJ-SEBAS-AI-MUSIC-STUDIO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
