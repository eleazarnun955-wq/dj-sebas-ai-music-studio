name: Construir APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Capacitor
        run: npm install
      - name: Preparar archivos de la aplicación
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg sw.js www/
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Sincronizar aplicación
        run: npx cap sync android
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Construir APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: DJ-SEBAS-MUSIC-STUDIO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
